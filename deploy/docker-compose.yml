name: agentic-flow

services:
  agent-canvas-init:
    image: alpine:3.21
    user: "0:0"
    environment:
      CANVAS_UID: ${AGENT_CANVAS_UID:-1000}
    volumes:
      - agent-canvas-state:/state
      - agent-canvas-projects:/projects
    command:
      - sh
      - -ec
      - |
        mkdir -p /state /projects
        chown -R "$${CANVAS_UID}:$${CANVAS_UID}" /state /projects
        chmod -R u+rwX /state /projects
    restart: "no"

  agent-canvas:
    image: ghcr.io/openhands/agent-canvas:${AGENT_CANVAS_VERSION:-latest}
    container_name: agent-canvas
    restart: unless-stopped
    depends_on:
      agent-canvas-init:
        condition: service_completed_successfully
    environment:
      PORT: "8000"
      LOCAL_BACKEND_API_KEY: ${AGENT_CANVAS_API_KEY}
      OH_SECRET_KEY: ${AGENT_CANVAS_SECRET_KEY}
    volumes:
      - agent-canvas-state:/home/openhands/.openhands
      - agent-canvas-projects:/projects
      - ../sandbox:/projects/pmm-agentic-flow/sandbox:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  orchestrator:
    build:
      context: ../orchestrator
    container_name: orchestrator
    restart: unless-stopped
    depends_on:
      agent-canvas:
        condition: service_started
    environment:
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-8080}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY}
      AGENT_CANVAS_BASE_URL: http://agent-canvas:8000
      AGENT_CANVAS_PUBLIC_URL: ${AGENT_CANVAS_PUBLIC_URL:-http://127.0.0.1:8000}
      AGENT_CANVAS_API_KEY: ${AGENT_CANVAS_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LINODE_TOKEN: ${LINODE_TOKEN:-}
      WORKER_ROOT_PASSWORD: ${WORKER_ROOT_PASSWORD:-}
      STACK_CONFIG_PATH: /config/stack.yaml
      JIRA_WORKFLOW_PATH: /config/jira-workflow.yaml
      DATA_DIR: /data
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
    volumes:
      - ../config/stack.yaml:/config/stack.yaml:ro
      - ../config/jira-workflow.yaml:/config/jira-workflow.yaml:ro
      - orchestrator-data:/data
    ports:
      - "8080:8080"

volumes:
  agent-canvas-state:
  agent-canvas-projects:
  orchestrator-data:
