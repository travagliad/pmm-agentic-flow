name: agentic-flow

services:
  agent-canvas-init:
    image: alpine:3.21
    user: "0:0"
    environment:
      CANVAS_UID: ${AGENT_CANVAS_UID:-1000}
    volumes:
      - agent-canvas-state:/home/openhands/.openhands
    command:
      - sh
      - -ec
      - |
        mkdir -p /home/openhands/.openhands/storage \
                 /home/openhands/.openhands/workspaces \
                 /home/openhands/.openhands/automation \
                 /home/openhands/.openhands/agent-canvas
        chown -R "$${CANVAS_UID}:$${CANVAS_UID}" /home/openhands/.openhands
        chmod -R u+rwX /home/openhands/.openhands
        touch /home/openhands/.openhands/automation/.write-test
        rm -f /home/openhands/.openhands/automation/.write-test
        echo "volume ready for uid $${CANVAS_UID}"
    restart: "no"

  agent-canvas:
    image: ghcr.io/openhands/agent-canvas:${AGENT_CANVAS_VERSION:-latest}
    container_name: agent-canvas
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/bash", "/entrypoint-wrapper.sh"]
    depends_on:
      agent-canvas-init:
        condition: service_completed_successfully
    environment:
      PORT: "8000"
      LOCAL_BACKEND_API_KEY: ${AGENT_CANVAS_API_KEY}
      OH_SECRET_KEY: ${AGENT_CANVAS_SECRET_KEY}
      AGENT_CANVAS_UID: ${AGENT_CANVAS_UID:-1000}
      FILE_STORE: local
      LOCAL_STORAGE_PATH: /home/openhands/.openhands/storage
      AUTOMATION_WORKSPACE_BASE: /home/openhands/.openhands/workspaces
      AUTOMATION_BASE_URL: ${AGENT_CANVAS_PUBLIC_URL:-http://127.0.0.1:8000}
      AUTOMATION_DB_URL: sqlite+aiosqlite:////home/openhands/.openhands/automation/automations.db
    volumes:
      - agent-canvas-state:/home/openhands/.openhands
      - agent-canvas-projects:/projects
      - ../sandbox:/projects/pmm-agentic-flow/sandbox:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./agent-canvas-entrypoint.sh:/entrypoint-wrapper.sh:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s

  orchestrator:
    build:
      context: ../orchestrator
    container_name: orchestrator
    restart: unless-stopped
    depends_on:
      agent-canvas:
        condition: service_started
    environment:
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-8080}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY}
      AGENT_CANVAS_BASE_URL: http://agent-canvas:8000
      AGENT_CANVAS_PUBLIC_URL: ${AGENT_CANVAS_PUBLIC_URL:-http://127.0.0.1:8000}
      AGENT_CANVAS_API_KEY: ${AGENT_CANVAS_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LINODE_TOKEN: ${LINODE_TOKEN:-}
      WORKER_ROOT_PASSWORD: ${WORKER_ROOT_PASSWORD:-}
      STACK_CONFIG_PATH: /config/stack.yaml
      JIRA_WORKFLOW_PATH: /config/jira-workflow.yaml
      DATA_DIR: /data
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
    volumes:
      - ../config/stack.yaml:/config/stack.yaml:ro
      - ../config/jira-workflow.yaml:/config/jira-workflow.yaml:ro
      - orchestrator-data:/data
    ports:
      - "8080:8080"

volumes:
  agent-canvas-state:
  agent-canvas-projects:
  orchestrator-data:
