services:
  litellm:
    image: ghcr.io/berriai/litellm:main-v1.72.0-stable
    container_name: loop-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      GITHUB_COPILOT_TOKEN: ${GITHUB_COPILOT_TOKEN}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      COPILOT_EDITOR_VERSION: ${COPILOT_EDITOR_VERSION:-vscode/1.96.0}
      COPILOT_INTEGRATION_ID: ${COPILOT_INTEGRATION_ID:-vscode-chat}
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  agent-canvas-init:
    image: alpine:3.21
    container_name: loop-agent-canvas-init
    user: "0:0"
    environment:
      CANVAS_UID: ${AGENT_CANVAS_UID:-1000}
    volumes:
      - agent-canvas-state:/state
      - agent-canvas-projects:/projects
    command:
      - sh
      - -ec
      - |
        mkdir -p /state /projects
        chown -R "$${CANVAS_UID}:$${CANVAS_UID}" /state /projects
        chmod -R u+rwX /state /projects
        echo "agent-canvas volumes owned by uid $${CANVAS_UID}"
    restart: "no"

  agent-canvas:
    image: ghcr.io/openhands/agent-canvas:${AGENT_CANVAS_VERSION:-latest}
    container_name: loop-agent-canvas
    restart: unless-stopped
    depends_on:
      agent-canvas-init:
        condition: service_completed_successfully
    environment:
      PORT: "8000"
      LOCAL_BACKEND_API_KEY: ${AGENT_CANVAS_API_KEY}
      OH_SECRET_KEY: ${AGENT_CANVAS_SECRET_KEY}
    volumes:
      - agent-canvas-state:/home/openhands/.openhands
      - agent-canvas-projects:/projects
      - ../sandbox:/projects/pmm-agentic-flow/sandbox:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  orchestrator:
    build:
      context: ../orchestrator
    container_name: loop-orchestrator
    restart: unless-stopped
    depends_on:
      agent-canvas:
        condition: service_started
    environment:
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-8080}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY}
      AGENT_CANVAS_BASE_URL: http://agent-canvas:8000
      AGENT_CANVAS_PUBLIC_URL: https://${LOOP_DOMAIN}
      AGENT_CANVAS_API_KEY: ${AGENT_CANVAS_API_KEY}
      OPENHANDS_BASE_URL: http://agent-canvas:8000
      OPENHANDS_PUBLIC_URL: https://${LOOP_DOMAIN}
      OPENHANDS_API_KEY: ${AGENT_CANVAS_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      SANDBOX_TTL_HOURS: ${SANDBOX_TTL_HOURS:-72}
      MAX_AGENT_RETRIES: ${MAX_AGENT_RETRIES:-2}
      MAX_BUILD_RETRIES: ${MAX_BUILD_RETRIES:-5}
      LOOP_CONFIG_PATH: /config/loop.yaml
      JIRA_WORKFLOW_PATH: /config/jira-workflow.yaml
      DATA_DIR: /data
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
    volumes:
      - ../config/loop.yaml:/config/loop.yaml:ro
      - ../config/jira-workflow.yaml:/config/jira-workflow.yaml:ro
      - loop-data:/data
    ports:
      - "127.0.0.1:${ORCHESTRATOR_PORT:-8080}:8080"

  caddy:
    image: caddy:2.9-alpine
    container_name: loop-caddy
    restart: unless-stopped
    depends_on:
      - agent-canvas
      - orchestrator
    environment:
      LOOP_DOMAIN: ${LOOP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  agent-canvas-state:
  agent-canvas-projects:
  loop-data:
  caddy-data:
  caddy-config:
