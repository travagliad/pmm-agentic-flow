services:
  agent-canvas-init:
    image: alpine:3.21
    container_name: loop-agent-canvas-init
    user: "0:0"
    environment:
      CANVAS_UID: ${AGENT_CANVAS_UID:-1000}
    volumes:
      - agent-canvas-state:/state
      - agent-canvas-projects:/projects
    command:
      - sh
      - -ec
      - |
        mkdir -p /state /projects
        chown -R "$${CANVAS_UID}:$${CANVAS_UID}" /state /projects
        chmod -R u+rwX /state /projects
        echo "agent-canvas volumes owned by uid $${CANVAS_UID}"
    restart: "no"

  agent-canvas:
    image: ghcr.io/openhands/agent-canvas:${AGENT_CANVAS_VERSION:-latest}
    container_name: loop-agent-canvas
    restart: unless-stopped
    depends_on:
      agent-canvas-init:
        condition: service_completed_successfully
    environment:
      PORT: "8000"
      LOCAL_BACKEND_API_KEY: ${AGENT_CANVAS_API_KEY}
      OH_SECRET_KEY: ${AGENT_CANVAS_SECRET_KEY}
    volumes:
      - agent-canvas-state:/home/openhands/.openhands
      - agent-canvas-projects:/projects
      - ../sandbox:/projects/pmm-agentic-flow/sandbox:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  orchestrator:
    build:
      context: ../orchestrator
    container_name: loop-orchestrator
    restart: unless-stopped
    depends_on:
      agent-canvas:
        condition: service_started
    environment:
      ORCHESTRATOR_PORT: ${ORCHESTRATOR_PORT:-8080}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY}
      AGENT_CANVAS_BASE_URL: http://agent-canvas:8000
      AGENT_CANVAS_PUBLIC_URL: ${AGENT_CANVAS_PUBLIC_URL:-https://127.0.0.1}
      AGENT_CANVAS_API_KEY: ${AGENT_CANVAS_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LINODE_TOKEN: ${LINODE_TOKEN:-}
      WORKER_LINODE_REGION: ${WORKER_LINODE_REGION:-eu-central}
      WORKER_LINODE_TYPE: ${WORKER_LINODE_TYPE:-g6-standard-8}
      WORKER_ROOT_PASSWORD: ${WORKER_ROOT_PASSWORD:-}
      SANDBOX_TTL_HOURS: ${SANDBOX_TTL_HOURS:-72}
      MAX_AGENT_RETRIES: ${MAX_AGENT_RETRIES:-2}
      MAX_BUILD_RETRIES: ${MAX_BUILD_RETRIES:-5}
      LOOP_CONFIG_PATH: /config/loop.yaml
      JIRA_WORKFLOW_PATH: /config/jira-workflow.yaml
      DATA_DIR: /data
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
    volumes:
      - ../config/loop.yaml:/config/loop.yaml:ro
      - ../config/jira-workflow.yaml:/config/jira-workflow.yaml:ro
      - loop-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2.9-alpine
    container_name: loop-caddy
    restart: unless-stopped
    depends_on:
      - agent-canvas
      - orchestrator
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  agent-canvas-state:
  agent-canvas-projects:
  loop-data:
  caddy-data:
  caddy-config:
